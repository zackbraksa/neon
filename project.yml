name: OpenChat
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.1'
    CURRENT_PROJECT_VERSION: 2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    APS_ENVIRONMENT: development
  configs:
    Release:
      APS_ENVIRONMENT: production
targets:
  OpenChat:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [OpenChat]
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.neon
        PRODUCT_NAME: Neon
        EXECUTABLE_NAME: OpenChat
        PRODUCT_MODULE_NAME: OpenChat
        NEON_BACKEND_URL: http://localhost:8080
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: OpenChat/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Neon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": OpenChat/OpenChat.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": OpenChat/OpenChat-iOS.entitlements
  OpenChatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Neon.app/Contents/MacOS/OpenChat
    dependencies:
      - target: OpenChat
schemes:
  OpenChat:
    build:
      targets:
        OpenChat: all
    test:
      targets: [OpenChatTests]
